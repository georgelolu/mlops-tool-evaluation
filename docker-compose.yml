services:
  postgres:
    image: postgres:16
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpassword
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --allowed-hosts ${MLFLOW_ALLOWED_HOSTS:-localhost:5000}
      --cors-allowed-origins ${MLFLOW_CORS_ORIGINS:-http://localhost:5000}
      --backend-store-uri postgresql://mlflow:mlflowpassword@postgres:5432/mlflow
      --artifacts-destination s3://${MLFLOW_BUCKET}
    restart: unless-stopped

  prefect:
    image: prefecthq/prefect:3-latest
    container_name: prefect
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
    volumes:
      - prefect_data:/root/.prefect
    restart: unless-stopped

  trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    container_name: mlops-trainer
    depends_on:
      - mlflow
      - prefect
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: mlops-tool-evaluation
      PREFECT_API_URL: http://prefect:4200/api
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    command: python app/flow.py
    restart: "no"

volumes:
  postgres_data:
  prefect_data:
