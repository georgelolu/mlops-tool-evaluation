name: MLOps CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0e554922b7d27135d
  APP_DIR: /opt/mlops/application

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          url = request_url + "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {request_token}",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          token = data["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("GitHub OIDC claims:")
          print(
              json.dumps(
                  {
                      "iss": claims.get("iss"),
                      "aud": claims.get("aud"),
                      "sub": claims.get("sub"),
                      "repository": claims.get("repository"),
                      "ref": claims.get("ref"),
                      "repository_owner": claims.get("repository_owner"),
                      "event_name": claims.get("event_name"),
                  },
                  indent=2,
              )
          )
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::361103952701:role/mlops-tools-evaluation-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy application through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd ${APP_DIR}",
              "git fetch origin main",
              "git reset --hard origin/main",
              "docker compose pull",
              "docker compose build --pull",
              "docker compose up -d --remove-orphans",
              "docker compose ps",
              "curl -fsS http://localhost:5000 >/dev/null",
              "curl -fsS http://localhost:4200 >/dev/null",
              "echo Deployment completed successfully"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: ${STATUS}"

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json

                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
