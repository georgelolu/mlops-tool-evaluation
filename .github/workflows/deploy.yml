name: MLOps CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0e554922b7d27135d
  S3_BUCKET: mlops-tools-evaluation-d7e28c26c4424a6727c795bd2
  APP_DIR: /opt/mlops/application
  REPOSITORY_URL: https://github.com/georgelolu/mlops-tool-evaluation.git

jobs:
  deploy:
    name: Deploy MLOps Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::361103952701:role/mlops-tools-evaluation-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-MLOpsDeployment

      - name: Verify AWS identity
        run: |
          set -e
          aws sts get-caller-identity

      - name: Get current EC2 public IP
        id: ec2_ip
        shell: bash
        run: |
          set -e

          EC2_PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ -z "${EC2_PUBLIC_IP}" ] || [ "${EC2_PUBLIC_IP}" = "None" ]; then
            echo "ERROR: Could not determine EC2 public IP."
            exit 1
          fi

          echo "EC2 public IP: ${EC2_PUBLIC_IP}"
          echo "public_ip=${EC2_PUBLIC_IP}" >> "${GITHUB_OUTPUT}"

      - name: Deploy application through SSM
        shell: bash
        env:
          EC2_PUBLIC_IP: ${{ steps.ec2_ip.outputs.public_ip }}
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MLOps platform from GitHub Actions" \
            --parameters "commands=[
              \"set -e\",
              \"mkdir -p ${APP_DIR}\",
              \"cd ${APP_DIR}\",
              \"if [ -d .git ]; then git fetch origin main && git reset --hard origin/main; else git clone ${REPOSITORY_URL} .; fi\",
              \"cat > .env <<ENVEOF\",
              \"MLFLOW_BUCKET=${S3_BUCKET}\",
              \"AWS_DEFAULT_REGION=${AWS_REGION}\",
              \"MLFLOW_TRACKING_URI=http://mlflow:5000\",
              \"MLFLOW_ALLOWED_HOSTS=${EC2_PUBLIC_IP}:5000,localhost:5000,mlflow:5000\",
              \"MLFLOW_CORS_ORIGINS=http://${EC2_PUBLIC_IP}:5000,http://localhost:5000\",
              \"PREFECT_UI_API_URL=http://${EC2_PUBLIC_IP}:4200/api\",
              \"ENVEOF\",
              \"echo 'Generated deployment environment:'\",
              \"cat .env\",
              \"docker compose pull\",
              \"docker compose build --pull\",
              \"docker compose up -d --remove-orphans\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo "Waiting for deployment to complete..."

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: ${STATUS}"

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "Status" \
            --output text)

          if [ "${FINAL_STATUS}" != "Success" ]; then
            echo "ERROR: Deployment did not complete successfully."
            exit 1
          fi

      - name: Validate deployed services
        shell: bash
        env:
          EC2_PUBLIC_IP: ${{ steps.ec2_ip.outputs.public_ip }}
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Validate MLOps deployment" \
            --parameters "commands=[
              \"set -e\",
              \"cd ${APP_DIR}\",
              \"echo '===== Docker Compose Status ====='\",
              \"docker compose ps\",
              \"echo '===== Generated Environment ====='\",
              \"cat .env\",
              \"echo '===== MLflow Health ====='\",
              \"for i in {1..30}; do if curl -fsS http://localhost:5000/health; then echo; break; fi; echo 'Waiting for MLflow...'; sleep 5; done\",
              \"echo '===== Prefect Health ====='\",
              \"for i in {1..30}; do if curl -fsS http://localhost:4200/; then echo; break; fi; echo 'Waiting for Prefect...'; sleep 5; done\",
              \"echo '===== MLflow Container Command ====='\",
              \"docker inspect mlflow --format '{{json .Config.Cmd}}'\",
              \"echo '===== Final Container Status ====='\",
              \"docker compose ps\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Validation SSM Command ID: ${COMMAND_ID}"

          for i in {1..40}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)

            echo "Validation status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment validation completed successfully."

                echo "----- VALIDATION OUTPUT -----"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text

                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Validation failed with status: ${STATUS}"

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "Status" \
            --output text)

          if [ "${FINAL_STATUS}" != "Success" ]; then
            echo "ERROR: Deployment validation did not complete successfully."
            exit 1
          fi
