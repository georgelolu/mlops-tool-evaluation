name: MLOps CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::361103952701:role/mlops-tools-evaluation-github-actions-role
  EC2_INSTANCE_ID: i-0e554922b7d27135d
  APP_DIR: /opt/mlops/application
  REPOSITORY_URL: https://github.com/georgelolu/mlops-tool-evaluation.git

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-MLOpsDeployment

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy application through SSM
        shell: bash
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo '\''Preparing application repository...'\''",
              "if [ ! -d '\''${APP_DIR}/.git'\'' ]; then git clone '\''${REPOSITORY_URL}'\'' '\''${APP_DIR}'\''; else cd '\''${APP_DIR}'\'' && git remote set-url origin '\''${REPOSITORY_URL}'\'' && git fetch origin main && git reset --hard origin/main; fi",
              "cd '\''${APP_DIR}'\''",
              "echo '\''Application commit:'\''",
              "git rev-parse --short HEAD",
              "echo '\''Starting Docker deployment...'\''",
              "docker compose pull",
              "docker compose build --pull",
              "docker compose up -d --remove-orphans",
              "echo '\''Docker Compose status:'\''",
              "docker compose ps",
              "echo '\''Waiting for MLflow to become ready...'\''",
              "MLFLOW_READY=0",
              "i=1",
              "while [ $i -le 36 ]; do",
              "  echo \"MLflow readiness attempt $i/36...\"",
              "  if curl -fsS --connect-timeout 5 --max-time 10 http://localhost:5000/health >/dev/null 2>&1; then",
              "    MLFLOW_READY=1",
              "    echo '\''MLflow is healthy.'\''",
              "    break",
              "  fi",
              "  echo '\''MLflow is not ready yet. Waiting 5 seconds...'\''",
              "  sleep 5",
              "  i=$((i + 1))",
              "done",
              "if [ $MLFLOW_READY -ne 1 ]; then",
              "  echo '\''MLflow failed to become ready.'\''",
              "  echo '\''--- Docker Compose status ---'\''",
              "  docker compose ps",
              "  echo '\''--- MLflow logs ---'\''",
              "  docker compose logs --tail=150 mlflow",
              "  echo '\''--- PostgreSQL logs ---'\''",
              "  docker compose logs --tail=100 postgres",
              "  exit 1",
              "fi",
              "echo '\''Waiting for Prefect to become ready...'\''",
              "PREFECT_READY=0",
              "i=1",
              "while [ $i -le 36 ]; do",
              "  echo \"Prefect readiness attempt $i/36...\"",
              "  if curl -fsS --connect-timeout 5 --max-time 10 http://localhost:4200 >/dev/null 2>&1; then",
              "    PREFECT_READY=1",
              "    echo '\''Prefect is healthy.'\''",
              "    break",
              "  fi",
              "  echo '\''Prefect is not ready yet. Waiting 5 seconds...'\''",
              "  sleep 5",
              "  i=$((i + 1))",
              "done",
              "if [ $PREFECT_READY -ne 1 ]; then",
              "  echo '\''Prefect failed to become ready.'\''",
              "  echo '\''--- Docker Compose status ---'\''",
              "  docker compose ps",
              "  echo '\''--- Prefect logs ---'\''",
              "  docker compose logs --tail=150 prefect",
              "  exit 1",
              "fi",
              "echo '\''Final Docker Compose status:'\''",
              "docker compose ps",
              "echo '\''Deployment completed successfully.'\''"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: ${STATUS}"

                echo "--- SSM stdout ---"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo "--- SSM stderr ---"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Deployment timed out while waiting for SSM command."
          exit 1
