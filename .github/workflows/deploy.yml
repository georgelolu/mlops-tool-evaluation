name: MLOps CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0e554922b7d27135d
  APP_DIR: /opt/mlops/application
  REPOSITORY_URL: https://github.com/georgelolu/mlops-tool-evaluation.git

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::361103952701:role/mlops-tools-evaluation-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy application through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"echo 'Preparing application repository...'\",
              \"if [ ! -d '${APP_DIR}/.git' ]; then git clone '${REPOSITORY_URL}' '${APP_DIR}'; else cd '${APP_DIR}' && git remote set-url origin '${REPOSITORY_URL}' && git fetch origin main && git reset --hard origin/main; fi\",
              \"cd '${APP_DIR}'\",
              \"echo 'Application commit:'\",
              \"git rev-parse --short HEAD\",
              \"echo 'Starting Docker deployment...'\",
              \"docker compose pull\",
              \"docker compose build --pull\",
              \"docker compose up -d --remove-orphans\",
              \"echo 'Docker Compose status:'\",
              \"docker compose ps\",
              \"echo 'Waiting for MLflow to become ready...'\",
              \"curl -fsS --retry 24 --retry-delay 5 --retry-connrefused http://localhost:5000 >/dev/null || { echo 'MLflow failed to become ready.'; docker compose ps; docker compose logs --tail=100 mlflow; exit 1; }\",
              \"echo 'MLflow is healthy.'\",
              \"echo 'Waiting for Prefect to become ready...'\",
              \"curl -fsS --retry 24 --retry-delay 5 --retry-connrefused http://localhost:4200 >/dev/null || { echo 'Prefect failed to become ready.'; docker compose ps; docker compose logs --tail=100 prefect; exit 1; }\",
              \"echo 'Prefect is healthy.'\",
              \"echo 'Final Docker Compose status:'\",
              \"docker compose ps\",
              \"echo 'Deployment completed successfully.'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment completed successfully."

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: ${STATUS}"

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
                  --output json

                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          exit 1
